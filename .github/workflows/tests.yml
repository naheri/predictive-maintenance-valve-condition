# Lance les tests pytest à chaque push et à chaque pull request.
# Les tests utilisent des signaux simulés : les fichiers data/*.txt
# (non versionnés) ne sont pas nécessaires.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer pytest
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v
